</html><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 9º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano — Estudante Exemplo</p>
    </header>

    <!-- Área de Cards de Resumo -->
    <section class="cards-grid">
      <div class="card card-destaque">
        <h3>Média Geral</h3>
        <p id="card-media">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="card-atencao">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="card-frequencia">92%</p>
        <span class="legenda-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- O JavaScript vai preencher as linhas da tabela aqui -->
        </tbody>
      </table>
    </section>
  </div>

  <!-- Script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
